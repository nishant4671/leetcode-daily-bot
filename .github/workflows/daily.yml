name: Daily LeetCode Auto-Solve

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  solve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bot Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Auto-Solver
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python solve.py

      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          repository: nishant4671/leetcode
          token: ${{ secrets.GH_PAT }}
          path: target-repo

      - name: Commit and Push to LeetHub Repo
        run: |
          # Move the newly created folder (e.g. 0006-zigzag-conversion) into the target repo
          mv [0-9][0-9][0-9][0-9]-* target-repo/ 2>/dev/null || echo "No folder to move"
          
          cd target-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit."
          else
            git commit -m "Auto-sync Daily Challenge - LeetCode Bot"
            git push
          fi
